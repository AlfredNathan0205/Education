services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: exam_app
      POSTGRES_PASSWORD: exam_app_dev
      POSTGRES_DB: exam_app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_app"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://exam_app:exam_app_dev@postgres:5432/exam_app
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      API_PORT: "3001"
      ALLOW_DEV_TEST_POLICY: "true"
      DEFAULT_JURISDICTION: "XX"
      # Dev only: serve approved questions from a curriculum that is not ACTIVE yet. The API refuses to start with this in production.
      EXAM_ALLOW_UNACTIVATED_CURRICULUM: "true"
      # Where the guardian approval link in the email points. Required (and https) in production.
      WEB_BASE_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        cd packages/database && npx prisma migrate deploy &&
        cd /app && node apps/api/dist/main.js
      "

  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_URL: http://api:3001
      # Step 20: lets the API rate-limit per browser, not per web server. Set the same value in .env (read by the API).
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:-}
    depends_on:
      - api

volumes:
  pgdata:
