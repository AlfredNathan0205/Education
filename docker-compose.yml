services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: exam_app
      POSTGRES_PASSWORD: exam_app_dev
      POSTGRES_DB: exam_app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_app"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://exam_app:exam_app_dev@postgres:5432/exam_app
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      API_PORT: "3001"
      ALLOW_DEV_TEST_POLICY: "true"
      DEFAULT_JURISDICTION: "XX"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        cd packages/database && npx prisma migrate deploy &&
        cd /app && node apps/api/dist/main.js
      "

  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_URL: http://api:3001
    depends_on:
      - api

volumes:
  pgdata:
