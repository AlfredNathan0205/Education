name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: exam_app
          POSTGRES_PASSWORD: exam_app_dev
          POSTGRES_DB: exam_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exam_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://exam_app:exam_app_dev@localhost:5432/exam_app
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @exam-app/database db:generate

      - name: Run migrations
        run: pnpm --filter @exam-app/database db:migrate:deploy

      - name: Build packages
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Integration tests
        env:
          OTP_HMAC_SECRET: ${{ secrets.OTP_HMAC_SECRET || 'ci-test-secret-that-is-at-least-32-characters-long' }}
        run: pnpm --filter @exam-app/api test:integration

  # Step 12: the student journey in a real browser (phone and desktop sizes) against a stub API.
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @exam-app/web exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm --filter @exam-app/web test:e2e

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
